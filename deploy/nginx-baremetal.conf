# Nginx configuration for bare-metal deployment.
# Install: copy to /etc/nginx/sites-available/ocean-imagery-handler
#          and symlink into sites-enabled, then adjust paths below.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 2g;

    # --- Adjust these paths for your installation ---
    # WORKSPACE_DIR parent: tilesets live at {data_root}/tilesets/imagery/
    # Preview static files from the repository checkout.
    map $host $data_root {
        default /var/lib/ocean-imagery-handler/data;
    }

    upstream ocean_imagery_api {
        server 127.0.0.1:8100;
        keepalive 32;
    }

    server {
        listen 8102;
        server_name _;

        # Proxy FastAPI so preview page can call /api/ same-origin
        location /api/ {
            proxy_pass http://ocean_imagery_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Imagery tiles: /imagery/{tileset_name}/{z}/{x}/{y}.png
        # Must alias the tilesets directory; symlinks resolve relative to this root.
        location /imagery/ {
            alias /var/lib/ocean-imagery-handler/data/tilesets/imagery/;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }

        location = /preview {
            return 301 /preview/$is_args$args;
        }

        location /preview/ {
            alias /opt/ocean-imagery-handler/scripts/preview/;
            index index.html;
        }

        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
