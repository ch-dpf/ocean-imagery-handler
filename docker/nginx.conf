worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 2g;

  server {
        listen 80;
        server_name localhost;

        # Docker embedded DNS — re-resolve service names when containers restart
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Proxy FastAPI so preview page can call /api/ same-origin
        location /api/ {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Imagery tiles: /imagery/{tileset_name}/{z}/{x}/{y}.png
        location /imagery/ {
            alias /data/tilesets/imagery/;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=86400";
        }

        # Cesium preview page — force trailing slash so relative assets resolve correctly
        location = /preview {
            return 301 /preview/$is_args$args;
        }

        location /preview/ {
            alias /usr/share/nginx/preview/;
            index index.html;
        }

        location /health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
